[package]
name = "sandcastle"
version = "0.1.0"
edition = "2021"
description = "One OpenCode instance per Git repo, each in its own Apple container VM"
license = "MIT"
publish = false

[workspace]
members = [".", "ui"]
default-members = ["."]

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util", "sync"] }
toml = "0.8"
